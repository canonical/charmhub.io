name: PR checks
on:
  pull_request:
  push:
    branches: main

env:
  SECRET_KEY: insecure_test_key

permissions:
  contents: read

jobs:
  run-workshop:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: canonical/launch-workshop@v1

      - name: Run workshop
        run: |
          workshop run -- start &
          sleep 10
          curl --head --fail --retry-delay 3 --retry 30 --retry-all-errors http://localhost:8045
          curl --head --fail --retry-delay 3 --retry 30 --retry-all-errors http://localhost:5045/@vite/client

  run-cypress:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: canonical/launch-workshop@v1

      - name: Start production-mode app
        run: |
          workshop run -- prod &
          curl --head --fail --retry-delay 3 --retry 60 --retry-all-errors http://localhost:8045

      - name: Run Cypress as a Docker container
        run: |
          docker run --network="host" -v .:/app cypress/base:22.18.0 \
            bash "-c" "cd /app && npx cypress install && yarn run test-e2e"

  pack-rock:
    needs: changes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup LXD
        uses: canonical/setup-lxd@main

      - name: Setup rockcraft
        run: sudo snap install rockcraft --classic

      - name: Pack rock
        run: rockcraft pack

      - name: Import rock into Docker
        run: |
          ROCK_FILE="$(ls -1 charmhub-io_*.rock | head -n 1)"
          rockcraft.skopeo --insecure-policy copy \
            "oci-archive:${ROCK_FILE}" \
            docker-daemon:charmhub-io:rock

      - name: Start rock container
        run: |
          docker run -d -p 8045:8000 \
            --env FLASK_SECRET_KEY=insecure_secret_key \
            --env ENVIRONMENT=production \
            charmhub-io:rock
          sleep 1 && curl --head --fail --retry-delay 5 --retry 10 \
            --retry-connrefused http://127.0.0.1:8045

      - name: Run Lighthouse CI
        if: ${{ needs.changes.outputs.lighthouse == 'true' }}
        continue-on-error: true
        uses: treosh/lighthouse-ci-action@v12
        env:
          LHCI_GITHUB_APP_TOKEN: ${{ secrets.LHCI_GITHUB_APP_TOKEN }}
        with:
          configPath: ./.lighthouserc.js
          uploadArtifacts: true
          temporaryPublicStorage: true

  check-prettier:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Check Prettier
        run: yarn check-prettier

  changes:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      py: ${{ steps.filter.outputs.py }}
      js: ${{ steps.filter.outputs.js }}
      scss: ${{ steps.filter.outputs.scss }}
      lighthouse: ${{ steps.filter.outputs.lighthouse }}
    steps:
    - uses: dorny/paths-filter@v3
      id: filter
      with:
        filters: |
          py:
            - '.github/workflows/pr.yml'
            - '.python-version'
            - 'package.json'
            - 'yarn.lock'
            - 'vite.config.js'
            - 'vitePluginDetectInput.js'
            - '**/*.py'
            - 'requirements.txt'
            - 'templates/**/*'
          js:
            - '.github/workflows/pr.yml'
            - '**/*.js'
            - '**/*.ts'
            - '**/*.jsx'
            - '**/*.tsx'
            - 'package.json'
            - 'yarn.lock'
            - 'eslint.config.mjs'
            - 'vitest.config.js'
            - 'vite.config.js'
            - 'tsconfig.json'
          scss:
            - '.github/workflows/pr.yml'
            - '**/*.scss'
            - '.stylelintrc'
            - 'package.json'
            - 'yarn.lock'
          lighthouse:
            - '.github/workflows/pr.yml'
            - '.lighthouserc.js'
            - 'templates/**'
            - 'static/js/**'
            - 'static/sass/**'
            - 'webapp/**'
            - 'rockcraft.yaml'
            - 'vite.config.js'
            - 'package.json'
            - 'yarn.lock'
            - 'requirements.txt'

  lint-python:
    needs: changes
    if: ${{ needs.changes.outputs.py == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint Python
        run: yarn lint-python

  lint-scss:
    needs: changes
    if: ${{ needs.changes.outputs.scss == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install SCSS dependencies
        run: yarn install --immutable

      - name: Lint SCSS
        run: yarn lint-scss

  lint-js:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install JS dependencies
        run: yarn install --immutable

      - name: Lint JS
        run: yarn lint-js

  test-python:
    needs: changes
    if: ${{ needs.changes.outputs.py == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt coverage
          yarn install --immutable

      - name: Build assets
        run: yarn build

      - name: Run Python tests with coverage (offline)
        env:
          FLASK_DEBUG: "0"
        run: |
          sudo --preserve-env unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            user="$1"
            shift
            exec sudo --preserve-env --user="$user" -- "$@"
          ' bash "$(id -un)" env "PATH=$PATH" coverage run --source=. -m unittest discover tests
          coverage xml

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: python

  test-js:
    needs: changes
    if: ${{ needs.changes.outputs.js == 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: yarn

      - name: Install dependencies
        run: yarn install --immutable

      - name: Test JS (offline)
        run: |
          sudo --preserve-env unshare --net -- bash -c '
            set -euo pipefail
            ip link set lo up
            user="$1"
            shift
            exec sudo --preserve-env --user="$user" -- "$@"
          ' bash "$(id -un)" env "PATH=$PATH" yarn test-js --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          flags: javascript

  check-inclusive-naming:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check inclusive naming
        uses: canonical-web-and-design/inclusive-naming@main
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          fail-on-error: true
