name: charmhub-io
base: ubuntu@24.04

sdks:
  - name: uv
    channel: latest/stable
  - name: node
    channel: 24/stable

  - name: project-charmhub-io
    slots:
      app:
        interface: tunnel
        endpoint: localhost:8045 # Flask app
      vite:
        interface: tunnel
        endpoint: localhost:5045 # Vite dev server

  - name: system
    plugs:
      app:
        interface: tunnel
        endpoint: localhost:8045 # Flask app
      vite:
        interface: tunnel
        endpoint: localhost:5045 # Vite dev server

actions:
  start: yarn start
  build: yarn build
  test: yarn build && yarn test
  prod: yarn build && ENVIRONMENT=production FLASK_DEBUG=0 yarn serve
  yarn: yarn "$@"
