{% extends 'base_layout.html' %}

{% block meta_title %}Contact us{% endblock %}
{% block extra_meta %}<meta name="robots" content="noindex" />{% endblock %}

{% block content %}
<section class="p-strip is-deep">
  <div class="row">
    <div class="col-7">
      <h1>Something went wrong</h1>
      <div class="p-notification--negative">
        <div class="p-notification__content">
          <p class="p-notification__message">There was an error while sending your message. Please try again.</p>
        </div>
      </div>
      <a class="p-button--positive" href="/contact-us">Try again</a>
    </div>
  </div>
</section>
{% endblock %}
