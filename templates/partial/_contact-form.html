<form action="https://ubuntu.com/marketo/submit" method="post" id="mktoForm_8143" class="js-contact-form">
    <ul class="p-list">
      <li class="p-form-validation">
        <label for="contact-firstName">First name: *
        </label>
        <input required id="contact-firstName" name="firstName" maxlength="255" type="text">
      </li>

      <li class="p-form-validation">
        <label for="contact-lastName">Last name: *
        </label>
        <input required id="contact-lastName" name="lastName" maxlength="255" type="text">
      </li>

      <li class="p-form-validation">
        <label for="contact-company">Company name: *
        </label>
        <input required id="contact-company" name="company" maxlength="255" type="text">
      </li>

      <li class="p-form-validation">
        <label for="contact-title">Job title: *
        </label>
        <input required id="contact-title" name="title" maxlength="255" type="text">
      </li>

      <li class="p-form-validation">
        <label for="contact-email">Email: *
        </label>
        <input required id="contact-email" name="email" maxlength="255" type="email" pattern="^[^ ]+@[^ ]+\.[a-zA-Z]{2,26}$">
      </li>

      <li class="p-form-validation">
        <label for="contact-phone">Mobile/cell phone number:
        </label>
        <input id="contact-phone" name="phone" maxlength="255" type="tel">
      </li>

      <li class="p-form-validation">
        <label for="contact-country">Country: *
        </label>
        <select required id="contact-country" name="country">
          {% include 'partial/_country-options.html' %}
        </select>
      </li>
      <li class="js-state-field p-form-validation">
        <label for="contact-State">State: *</label>
        <select id="contact-State" name="State">
          <option value="">Select...</option>
          <optgroup label="Select Province" value="SelectProvince" data-country="CA">
            <option value="AB">Alberta</option>
            <option value="BC">British Columbia</option>
            <option value="MB">Manitoba</option>
            <option value="NB">New Brunswick</option>
            <option value="NF">Newfoundland</option>
            <option value="NT">Northwest Territories</option>
            <option value="NS">Nova Scotia</option>
            <option value="NU">Nunavut</option>
            <option value="ON">Ontario</option>
            <option value="PE">Prince Edward Island</option>
            <option value="QC">Quebec</option>
            <option value="SK">Saskatchewan</option>
            <option value="YT">Yukon Territory</option>
          </optgroup>
          <optgroup label="Select State" value="SelectState" data-country="US">
            <option value="AK">Alaska</option>
            <option value="AL">Alabama</option>
            <option value="AR">Arkansas</option>
            <option value="AZ">Arizona</option>
            <option value="CA">California</option>
            <option value="CO">Colorado</option>
            <option value="CT">Connecticut</option>
            <option value="DC">District of Columbia</option>
            <option value="DE">Delaware</option>
            <option value="FL">Florida</option>
            <option value="GA">Georgia</option>
            <option value="HI">Hawaii</option>
            <option value="IA">Iowa</option>
            <option value="ID">Idaho</option>
            <option value="IL">Illinois</option>
            <option value="IN">Indiana</option>
            <option value="KS">Kansas</option>
            <option value="KY">Kentucky</option>
            <option value="LA">Louisiana</option>
            <option value="MA">Massachusetts</option>
            <option value="MD">Maryland</option>
            <option value="ME">Maine</option>
            <option value="MI">Michigan</option>
            <option value="MN">Minnesota</option>
            <option value="MO">Missouri</option>
            <option value="MS">Mississippi</option>
            <option value="MT">Montana</option>
            <option value="NC">North Carolina</option>
            <option value="ND">North Dakota</option>
            <option value="NE">Nebraska</option>
            <option value="NH">New Hampshire</option>
            <option value="NJ">New Jersey</option>
            <option value="NM">New Mexico</option>
            <option value="NV">Nevada</option>
            <option value="NY">New York</option>
            <option value="OH">Ohio</option>
            <option value="OK">Oklahoma</option>
            <option value="OR">Oregon</option>
            <option value="PA">Pennsylvania</option>
            <option value="PR">Puerto Rico</option>
            <option value="RI">Rhode Island</option>
            <option value="SC">South Carolina</option>
            <option value="SD">South Dakota</option>
            <option value="TN">Tennessee</option>
            <option value="TX">Texas</option>
            <option value="UT">Utah</option>
            <option value="VA">Virginia</option>
            <option value="VT">Vermont</option>
            <option value="WA">Washington</option>
            <option value="WI">Wisconsin</option>
            <option value="WV">West Virginia</option>
            <option value="WY">Wyoming</option>
          </optgroup>
        </select>
      </li>
      <li class="p-form-validation">
        <label for="contact-Comments_from_lead__c">What would you like to talk to us about? *
        </label>
        <textarea required id="contact-Comments_from_lead__c" name="Comments_from_lead__c" rows="5" maxlength="2000"></textarea>
      </li>
      <li>
          <input value="yes" id="contact-canonicalUpdatesOptIn" name="canonicalUpdatesOptIn" type="checkbox" />
          <label for="contact-canonicalUpdatesOptIn">I agree to receive information about Canonical&rsquo;s products and services.</label>
      </li>
      <li class="u-sv3">In submitting this form, I confirm that I have read and agree to <a href="https://canonical.com/legal/data-privacy/contact" target="_blank">Canonical&rsquo;s Privacy Notice</a> and <a aria-label="Read the Canonical privacy policy" target="_blank" href="https://canonical.com/legal/data-privacy">Privacy Policy</a>.</li>
      <li>
        <button type="submit" class="p-button--positive">Submit</button>
        <input type="hidden" name="formid" value="8143">
        <input type="hidden" name="Consent_to_Processing__c" value="yes">
        <input type="hidden" name="acquisition_url" value="{{ request.url if request.cookies.get('_cookies_accepted') in ['functionality', 'performance', 'all'] else request.base_url }}">
        <input type="hidden" name="preferredLanguage" value="">
        <input type="hidden" name="_cookies_accepted" value="{{ request.cookies.get('_cookies_accepted', '') }}">
        <input type="hidden" name="utm_source" value="">
        <input type="hidden" name="utm_medium" value="">
        <input type="hidden" name="utm_campaign" value="">
        <input type="hidden" name="utm_content" value="">
        <input type="hidden" name="utm_term" value="">
        <input type="hidden" name="GCLID__c" value="">
        <input type="hidden" name="Facebook_Click_ID__c" value="">
      </li>
    </ul>
    <div class="u-off-screen" aria-hidden="true">
      <label for="contact-website">Website</label>
      <input type="text" id="contact-website" name="website" value="" tabindex="-1" autocomplete="off">
      <label for="contact-name">Name</label>
      <input type="text" id="contact-name" name="name" value="" tabindex="-1" autocomplete="off">
    </div>
  <input type="hidden" name="returnURL" value="{{ contact_return_url }}" />
</form>
